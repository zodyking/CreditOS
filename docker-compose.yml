# Dokploy Compose service, or plain `docker compose up -d`.
#
# No environment variables are required. If NUXT_SESSION_PASSWORD or
# APP_ENCRYPTION_KEY are absent, the container generates them on first start
# and saves them on the creditos-data volume. PostgreSQL is not part of this
# stack: the first page asks for a connection string and stores it encrypted
# on that same volume. Compose creates the volume on the first deploy.
#
# The app listens on 8176. Point the Dokploy domain at container port 8176.
services:
  creditos:
    build:
      context: .
      dockerfile: Dockerfile
    image: creditos:latest
    restart: unless-stopped
    ports:
      - "8176:8176"
    # Dokploy writes the Environment tab to .env. It is optional.
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "8176"
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_DEFAULT_MODEL: ${OPENROUTER_DEFAULT_MODEL:-openai/gpt-4o-mini}
      MAIL_OUTBOUND_PROVIDER: ${MAIL_OUTBOUND_PROVIDER:-sandbox}
      MAIL_INBOUND_PROVIDER: ${MAIL_INBOUND_PROVIDER:-manual}
      MAIL_WEBHOOK_SECRET: ${MAIL_WEBHOOK_SECRET:-}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      DATA_DIR: /data
    volumes:
      - creditos-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8176/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  creditos-data:
