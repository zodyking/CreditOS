# Dokploy Compose deployment, or plain `docker compose up -d`.
# PostgreSQL is EXTERNAL: point DATABASE_URL at a managed instance or at a
# Dokploy Postgres service. A commented-out local Postgres service is included
# for evaluation only.
#
# Host port: CREDITOS_HOST_PORT (default 3010) → container 3000.
# Dokploy's own panel already listens on host port 3000, so this file does not
# publish 3000. In Dokploy, public traffic goes through the Domains tab to
# container port 3000; leave the ports mapping in place.
services:
  creditos:
    build:
      context: .
      dockerfile: Dockerfile
    image: creditos:latest
    restart: unless-stopped
    ports:
      - "${CREDITOS_HOST_PORT:-3010}:3000"
    environment:
      NODE_ENV: production
      APP_MODE: ${APP_MODE:-demo}
      DATABASE_URL: ${DATABASE_URL}
      NUXT_SESSION_PASSWORD: ${NUXT_SESSION_PASSWORD}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_DEFAULT_MODEL: ${OPENROUTER_DEFAULT_MODEL:-openai/gpt-4o-mini}
      MAIL_OUTBOUND_PROVIDER: ${MAIL_OUTBOUND_PROVIDER:-sandbox}
      MAIL_INBOUND_PROVIDER: ${MAIL_INBOUND_PROVIDER:-manual}
      MAIL_WEBHOOK_SECRET: ${MAIL_WEBHOOK_SECRET:-}
      DEMO_SEED: ${DEMO_SEED:-true}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      DATA_DIR: /data
    volumes:
      - creditos-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── Optional local Postgres for evaluation only ────────────────────────────
  # postgres:
  #   image: postgres:16-alpine
