# Dokploy Compose service, or plain `docker compose up -d`.
#
# The Environment tab only needs two secrets:
#   NUXT_SESSION_PASSWORD
#   APP_ENCRYPTION_KEY
# PostgreSQL is not part of this stack. On first launch the app asks for a
# connection string, checks it, and saves it encrypted in the creditos-data
# volume. Change it later in Settings → Database. Compose creates that volume
# on the first deploy.
#
# The app listens on 8176, a high port that is not already used by Dokploy.
# Point the domain at container port 8176.
services:
  creditos:
    build:
      context: .
      dockerfile: Dockerfile
    image: creditos:latest
    restart: unless-stopped
    ports:
      - "8176:8176"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "8176"
      APP_MODE: ${APP_MODE:-demo}
      NUXT_SESSION_PASSWORD: ${NUXT_SESSION_PASSWORD:?Set NUXT_SESSION_PASSWORD in the Dokploy Environment tab}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?Set APP_ENCRYPTION_KEY in the Dokploy Environment tab}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_DEFAULT_MODEL: ${OPENROUTER_DEFAULT_MODEL:-openai/gpt-4o-mini}
      MAIL_OUTBOUND_PROVIDER: ${MAIL_OUTBOUND_PROVIDER:-sandbox}
      MAIL_INBOUND_PROVIDER: ${MAIL_INBOUND_PROVIDER:-manual}
      MAIL_WEBHOOK_SECRET: ${MAIL_WEBHOOK_SECRET:-}
      DEMO_SEED: ${DEMO_SEED:-true}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      DATA_DIR: /data
    volumes:
      - creditos-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8176/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  creditos-data:
