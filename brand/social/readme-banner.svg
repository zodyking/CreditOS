      <circle cx="26" cy="84" r="5" fill="#3DBE6E"/><text x="40" y="88">Bureau Specialist</text><text x="210" y="88" text-anchor="end" fill="#3DBE6E" font-weight="600">SUPPORT</text>
      <circle cx="26" cy="110" r="5" fill="#E5484D"/><text x="40" y="114">Adversarial Skeptic</text><text x="210" y="114" text-anchor="end" fill="#E5484D" font-weight="600">OPPOSE</text>
      <circle cx="26" cy="136" r="5" fill="#3DBE6E"/><text x="40" y="140">Compliance Reviewer</text><text x="210" y="140" text-anchor="end" fill="#3DBE6E" font-weight="600">SUPPORT</text>
