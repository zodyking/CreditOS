    <path d="M42.93 18.98 A17 17 0 1 0 42.93 45.02" fill="none" stroke="url(#arc)" stroke-width="6" stroke-linecap="round"/>
    <path d="M21 32 H27 L30.5 24.5 L34 39.5 L37.5 32 H51" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
