  <text x="240" y="196" font-family="Inter, 'Inter Variable', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="500" letter-spacing="-0.3" fill="#AEB9CF">Credit intelligence, under your control.</text>

  <g font-family="'JetBrains Mono', 'JetBrains Mono Variable', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" letter-spacing="1.2">
