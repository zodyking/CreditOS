    <linearGradient id="arc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#35CCBF"/>
      <stop offset="1" stop-color="#12978C"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
